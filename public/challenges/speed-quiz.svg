<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#141029"/>
      <stop offset="100%" stopColor="#080612"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#7665FF"/>
      <stop offset="50%" stopColor="#A8E62E"/>
      <stop offset="100%" stopColor="#7665FF"/>
    </linearGradient>
    <radialGradient id="sqGlow" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stopColor="#7665FF" stopOpacity="0.3"/>
      <stop offset="100%" stopColor="transparent"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" rx="20" fill="url(#sqBg)"/>
  <rect width="800" height="450" rx="20" fill="url(#sqGlow)"/>

  <!-- Graphic: Digital Frequency Pulse -->
  <g transform="translate(460, 100)" opacity="0.85">
    <path d="M0 130 H80 L110 50 L140 220 L170 90 L190 150 L220 120 L240 140 H340" stroke="url(#pulseGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="140" cy="220" r="8" fill="#A8E62E"/>
    <circle cx="110" cy="50" r="8" fill="#7665FF"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(60, 80)">
    <rect width="135" height="32" rx="16" fill="#7665FF" fill-opacity="0.15" stroke="#7665FF" stroke-width="1.5"/>
    <text x="20" y="21" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="#9E90FF" letter-spacing="1.5">WEEKLY ARENA</text>
    <text x="155" y="21" font-family="'DM Mono', monospace" font-size="12" fill="#FFFFFF" fill-opacity="0.5">CC-FCQ2</text>

    <text x="0" y="95" font-family="Inter, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="-1">
      Speed Quiz 2.0
    </text>

    <text x="0" y="145" font-family="Inter, sans-serif" font-weight="400" font-size="18" fill="#FFFFFF" fill-opacity="0.8">
      <tspan x="0" dy="0">Rapid-fire technical competition testing</tspan>
      <tspan x="0" dy="28">frontend engineering and algorithm precision.</tspan>
    </text>

    <g transform="translate(0, 220)">
      <text x="0" y="0" font-family="'DM Mono', monospace" font-size="13" fill="#A8E62E" font-weight="600">
        WEEKLY SESSIONS
      </text>
      <text x="170" y="0" font-family="'DM Mono', monospace" font-size="13" fill="#FFFFFF" fill-opacity="0.4">
        • ARENA RANKINGS
      </text>
    </g>
  </g>
</svg>
