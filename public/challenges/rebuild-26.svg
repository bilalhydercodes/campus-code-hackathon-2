<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="rbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#141416"/>
      <stop offset="100%" stopColor="#08080A"/>
    </linearGradient>
    <linearGradient id="rbNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#A8E62E"/>
      <stop offset="100%" stopColor="#7665FF"/>
    </linearGradient>
    <radialGradient id="rbGlow" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#A8E62E" stopOpacity="0.25"/>
      <stop offset="50%" stopColor="#7665FF" stopOpacity="0.15"/>
      <stop offset="100%" stopColor="transparent"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" rx="20" fill="url(#rbBg)"/>
  <rect width="800" height="450" rx="20" fill="url(#rbGlow)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Graphic: Geometric 3D Code Window Motif -->
  <g transform="translate(480, 70)" opacity="0.9">
    <polygon points="50,40 260,10 280,240 70,270" fill="#1C1B24" stroke="url(#rbNeon)" stroke-width="2.5"/>
    <polygon points="30,60 240,30 260,260 50,290" fill="#242331" stroke="#A8E62E" stroke-width="2" opacity="0.8"/>
    <circle cx="80" cy="85" r="5" fill="#FF5F56"/>
    <circle cx="98" cy="83" r="5" fill="#FFBD2E"/>
    <circle cx="116" cy="81" r="5" fill="#27C93F"/>
    <line x1="75" y1="120" x2="200" y2="105" stroke="#7665FF" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="145" x2="160" y2="135" stroke="#A8E62E" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="170" x2="225" y2="150" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="195" x2="185" y2="180" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(60, 80)">
    <!-- Badge -->
    <rect width="135" height="32" rx="16" fill="#A8E62E" fill-opacity="0.15" stroke="#A8E62E" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="4.5" fill="#A8E62E"/>
    <text x="32" y="21" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="#A8E62E" letter-spacing="1.5">LIVE NOW</text>
    
    <text x="155" y="21" font-family="'DM Mono', monospace" font-size="12" fill="#FFFFFF" fill-opacity="0.5">CC-RB26</text>

    <!-- Title -->
    <text x="0" y="95" font-family="Inter, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="-1">
      ReBuild '26
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" font-family="Inter, sans-serif" font-weight="400" font-size="18" fill="#FFFFFF" fill-opacity="0.8" line-height="1.5">
      <tspan x="0" dy="0">Friday recreate. Saturday rebuild.</tspan>
      <tspan x="0" dy="28">Solo builder arena • Frontend only.</tspan>
    </text>

    <!-- Prize & Dates -->
    <g transform="translate(0, 220)">
      <text x="0" y="0" font-family="'DM Mono', monospace" font-size="13" fill="#A8E62E" font-weight="600">
        NOV 06 – 07, 2026
      </text>
      <text x="170" y="0" font-family="'DM Mono', monospace" font-size="13" fill="#FFFFFF" fill-opacity="0.4">
        • ONLINE ARENA
      </text>
    </g>
  </g>
</svg>
